# Configurazione tastiera (valori key SFML)
# freccia su=73, giu=74, sinistra=71, destra=72
# spazio=56, alt sinistro=39
KEY_UP=73
KEY_DOWN=74
KEY_LEFT=71
KEY_RIGHT=72
KEY_JUMP=39
KEY_SHOOT=56

# Configurazione Joystick (Assi: 0=X, 1=Y. Pulsanti: 0, 1, 2, 3...)
# NOTA: JOY_JUMP e JOY_SHOOT vengono impostati dal gioco durante
# STATE_CONFIG_JOY. Se non sono presenti qui (o sono -1), il gioco
# passa per la schermata di configurazione joystick al primo avvio.
# Dopo la configurazione, il gioco salva automaticamente questi valori.
JOY_AXIS_X=0
JOY_AXIS_Y=1
# JOY_JUMP e JOY_SHOOT NON presenti: il gioco richiedera' la configurazione
# del joystick al primo avvio. Dopo la config, verra' scritto:
# JOY_JUMP=N (pulsante salto)
# JOY_SHOOT=M (pulsante sparo)
